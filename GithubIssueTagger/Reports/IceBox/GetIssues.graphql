query($owner: String!,
      $repo: String!,
      $after: String,
      $label: String!) { 
  repository(owner: $owner, name:$repo){
    issues(first:100, after: $after, labels: [$label], states: [OPEN]){
      totalCount,
      pageInfo {
        hasNextPage,
        endCursor
      },
      nodes {
        number
      }
    }
  }
}